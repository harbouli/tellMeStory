version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tellmestory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tellmestory
      POSTGRES_USER: tellmestory_user
      POSTGRES_PASSWORD: tellmestory_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tellmestory-network

  adminer:
    image: adminer:4.8.1
    container_name: tellmestory-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - tellmestory-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  tellmestory-network:
    driver: bridge