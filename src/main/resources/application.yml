server:
  port: 8080

spring:
  application:
    name: tellMeStory
  
  datasource:
    url: jdbc:postgresql://localhost:5432/tellmestory
    driver-class-name: org.postgresql.Driver
    username: tellmestory_user
    password: tellmestory_password
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: myVeryLongSecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm
    expiration: 86400